webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = [
        "--disable-features=PasswordLeakDetection",
        "--remote-allow-origins=*",
        "--test-type",
        "--no-sandbox",
        "--start-maximized"
      ]
    }
  }
}

serenity {
  take.screenshots = FOR_FAILURES
}
