webdriver.driver=chrome
# El popup de "contraseña filtrada" de Chrome aparece tras el login y tapa la página:
# los clics siguientes no llegan a su destino. Desactivado junto con el gestor de contraseñas.
chrome.switches=--start-maximized;--disable-save-password-bubble;--password-store=basic;--disable-features=PasswordLeakDetection
serenity.take.screenshots=FOR_FAILURES
